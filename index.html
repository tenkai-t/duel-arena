 if(f.loot){draw(i,f.loot);if(G.over)return;if(me.hand.length){const t=i?[...me.hand].sort((a,b)=>b.cost-a.cost)[0]:me.hand[await ask('捨てるカードを選ぶ',me.hand.map(x=>`${x.name}(コスト${x.cost})`))];me.hand=me.hand.filter(x=>x!==t);me.gy.push(t)}}

 if(c.type=='c'){c.sick=!c.fl.includes('h');c.tapped=false;if(s){me.bz=me.bz.filter(x=>x!==s);c.under=[...(s.under||[]),s];s.under=[];c.sick=s.sick;c.tapped=s.tapped}me.bz.push(c);await fx(i,c.fx)}else{await fx(i,c.fx);if(c.fl.includes('w'))await fx(i,c.fx);if(c.fl.includes('m')){c.tapped=false;me.mana.push(c)}else me.gy.push(c)}}
async function breakSh(a,d,n){const D=G.p[d];for(let k=0;k<n&&!G.over;k++){const sv=D.bz.find(x=>x.fl.includes('v'));if(sv&&D.shields.length){destroy(d,sv);log(`「${sv.name}」が身代わりになった`);render();await wait(400);continue}const s=D.shields.pop();if(!s)break;log(`${who(d)}のシールドをブレイク！`);sfx(180,.25,'sawtooth',.07);render();hit(d);await wait(350);
 if(s.fl.includes('s')&&!G.nt){const use=d==1||await ask(`シールド・トリガー！「${s.name}」を使う？`,['使う','手札に加える'],fxText(s))==0;if(use){await enter(d,s);render();await wait(500);continue}}
 D.hand.push(s)}}
async function eot(i){for(const c of [...G.p[i].bz])if(c.eot&&!G.over&&G.p[i].bz.includes(c)){await fx(i,c.eot);render();await wait(400)}}
function dyn(c,o){const au=G.p[o].bz.reduce((a,x)=>a+(x!==c&&x.aura?x.aura:0),0);const s=c.sc;if(!s)return au;const p=G.p[o];return au+(s.k=='bz'?Math.max(0,p.bz.length-1)*s.v:s.k=='low'?Math.max(0,5-p.shields.length)*s.v:s.k=='sh'?p.shields.length*s.v:s.k=='hand'?Math.max(0,5-p.hand.length)*s.v:Math.floor(p.gy.length/2)*s.v)}
const cs=(p,c)=>Math.max(1,c.cost-(c.type=='c'?p.bz.reduce((a,x)=>a+(x.cr||0),0):0)+(c.type=='s'?(G.p[0]===p?G.p[1]:G.p[0]).bz.reduce((a,x)=>a+(x.tx||0),0):0));
async function bt(c,t,a){const bc=(c.pa||0)+dyn(c,a),bd=dyn(t,1-a);c.pow+=bc;t.pow+=bd;battle(c,t,a);c.pow-=bc;t.pow-=bd;if(c.winfx&&G.p[a].bz.includes(c)&&!G.p[1-a].bz.includes(t))await fx(a,c.winfx)}
function battle(c,t,a){sfx(120,.18);log(`「${c.name}」と「${t.name}」が戦闘`);const cd=c.pow<=t.pow,td=c.pow>=t.pow;if(td)destroy(1-a,t);if(cd)destroy(a,c);if(cd&&!td&&c.fl.includes('k'))destroy(1-a,t);if(td&&!cd&&t.fl.includes('k'))destroy(a,c)}
async function attack(a,c,t){const D=G.p[1-a];c.tapped=true;if(c.atk){await fx(a,c.atk);render()}
 if(t==='p'){const bl=c.fl.includes('u')||G.nb==a+1?[]:D.bz.filter(x=>!x.tapped&&x.fl.includes('b'));let blk=null;
  if(bl.length){if(1-a==0){const r=await ask(`「${c.name}」(${c.pow})が攻撃！`,[...bl.map(x=>`${x.name}(${x.pow})でブロック`),'ブロックしない']);blk=bl[r]||null}
   else blk=diff==0?(Math.random()<.3?bl[0]:null):bl.find(x=>x.pow>c.pow||(x.fl.includes('k')&&x.pow>=c.pow-1000))||bl.find(x=>x.pow==c.pow&&x.cost<=c.cost)||(D.shields.length<=2?[...bl].sort((a,b)=>a.pow-b.pow)[0]:null)}
  if(blk){blk.tapped=true;if(blk.blkfx)await fx(1-a,blk.blkfx);log(`${who(1-a)}の「${blk.name}」がブロック！`);await bt(c,blk,a)}
  else if(!D.shields.length){finish(a);return}
  else G.nt=c.fl.includes('n');await breakSh(a,1-a,c.fl.includes('q')?4:c.fl.includes('t')?3:c.fl.includes('d')?2:1);G.nt=false}
 else await bt(c,t,a);if(c.fl.includes('2')&&!c.did2&&G.p[a].bz.includes(c)){c.did2=true;c.tapped=false;log(`「${c.name}」は再び動ける！`)}
 sel=null;render()}
async function startTurn(i){const me=G.p[i];G.t=i;G.nb=0;me.mana.forEach(m=>m.tapped=false);me.bz.forEach(c=>{if(c.lock)c.lock=false;else c.tapped=false;c.sick=false;c.did2=false;if(c.bf){c.pow-=c.bf;c.bf=0}});me.charged=false;sel=null;
 if(!G.first)draw(i,1);G.first=false;if(G.over)return;for(const c of [...me.bz])if(c.sot&&!G.over){await fx(i,c.sot);if(c.sot.grow){c.pow+=c.sot.grow;c.gw=(c.gw||0)+c.sot.grow;log(`「${c.name}」が成長した`)}}if(G.over)return;log(`── ${who(i)}のターン ──`);render();
 if(i){busy=true;await cpu();if(!G.over)await eot(1);busy=false;const nx=G.xt==2?1:0;G.xt=0;if(!G.over)startTurn(nx)}}
async function cpu(){if(diff==0)return cpuEasy();const me=G.p[1],op=G.p[0];await wait(600);
 const worth=c=>{const f=c.fx;if(!f||c.type!='s')return true;return(!f.kill||op.bz.some(x=>x.pow<=f.kill))&&(!f.bounce||op.bz.length>0)&&(!f.tap||op.bz.some(x=>!x.tapped))&&(!f.disc||op.hand.length>0)&&(!f.wipe||op.bz.filter(x=>x.pow<=f.wipe).length>me.bz.filter(x=>x.pow<=f.wipe).length)&&(!f.rev||me.gy.some(x=>x.type=='c'))&&(!f.sbreak||op.shields.length>0)&&(!f.buff||me.bz.length>0)&&(!f.untap||me.bz.some(x=>x.tapped))&&(!f.steal||op.hand.length>0)&&(!f.mill||op.deck.length>6)&&(!f.weak||op.bz.length>0)&&(!f.freeze||op.bz.some(x=>!x.tapped))&&(!f.killt||op.bz.some(x=>x.tapped&&x.pow<=f.killt))&&(!f.rec||me.bz.some(x=>x.fx))&&(!f.refresh||me.mana.filter(m=>m.tapped).length>=3)&&(!f.wheel||me.hand.length<=2)&&(!f.sswap||(me.hand.length>1&&me.shields.length>0))&&(!f.lock||op.bz.length>0)&&(!f.nb||me.bz.some(x=>!x.tapped&&!x.sick))&&(!f.loot||me.hand.length>0)&&(!f.sac||me.bz.length>0)&&(!f.dig||me.deck.length>3)&&(!f.reani||me.gy.some(x=>x.type=='c'&&x.cost<=f.reani&&!x.fl.includes('e')))&&(!f.mret||me.mana.length>3)&&(!f.cheat||me.hand.some(x=>x.type=='c'&&x.cost<=f.cheat&&!x.fl.includes('e')))};
 const keep=c=>{let s=(c.cost<=me.mana.length+1?6:0)+(c.type=='c'?1:0)-c.cost*.2;const has=me.mana.some(m=>m.civ==c.civ);if(!has&&me.hand.some(x=>x!==c&&x.civ==c.civ))s-=5;if(!has&&me.mana.length<3)s-=2;return s};
 if(me.hand.length&&me.mana.length<10&&(me.hand.length>1||me.mana.length<4)){const c=[...me.hand].sort((a,b)=>keep(a)-keep(b))[0];me.hand=me.hand.filter(x=>x!==c);c.tapped=false;me.mana.push(c);log('相手がマナを置いた');render();await wait(500)}
 for(;;){const pl=me.hand.filter(c=>canPay(me,c)&&worth(c)).sort((a,b)=>b.cost-a.cost)[0];if(!pl||G.over)break;pay(me,pl);me.hand=me.hand.filter(x=>x!==pl);await enter(1,pl,pl.fl.includes('e')?evo(me,pl).sort((a,b)=>a.pow-b.pow)[0]:null);render();await wait(650)}
 for(const c of [...me.bz].filter(c=>!c.tapped&&!c.sick).sort((a,b)=>b.pow-a.pow)){if(G.over)return;if(c.tapped||!me.bz.includes(c))continue;
  const tg=op.bz.filter(x=>x.tapped&&!x.fl.includes('z')&&(x.pow<c.pow||(x.pow==c.pow&&x.cost>=c.cost))).sort((a,b)=>b.pow-a.pow)[0];
  const bl=op.bz.filter(x=>!x.tapped&&x.fl.includes('b'));
  const safe=c.fl.includes('u')||!bl.length||bl.every(x=>x.pow<c.pow&&!x.fl.includes('k'));
  const lethal=!op.shields.length&&(!bl.length||c.fl.includes('u'));
  if(tg&&!lethal)await attack(1,c,tg);
  else if(lethal||(safe&&(!c.fl.includes('b')||op.shields.length<=2))||(op.shields.length<=1&&bl.length<2))await attack(1,c,'p');
  render();await wait(600)}}
async function cpuEasy(){const me=G.p[1],op=G.p[0];await wait(600);
 if(me.hand.length&&me.mana.length<10){const c=me.hand[Math.random()*me.hand.length|0];me.hand=me.hand.filter(x=>x!==c);c.tapped=false;me.mana.push(c);log('相手がマナを置いた');render();await wait(500)}
 for(let g=0;g<6;g++){const pl=shuffle(me.hand.filter(c=>canPay(me,c)))[0];if(!pl||G.over)break;pay(me,pl);me.hand=me.hand.filter(x=>x!==pl);await enter(1,pl,pl.fl.includes('e')?evo(me,pl)[0]:null);render();await wait(650)}
 for(const c of [...me.bz]){if(G.over)return;if(c.tapped||c.sick||!me.bz.includes(c)||Math.random()<.4)continue;const t=op.bz.filter(x=>x.tapped&&!x.fl.includes('z'))[0];await attack(1,c,t&&Math.random()<.5?t:'p');render();await wait(600)}}
async function cpuOld(){const me=G.p[1],op=G.p[0];await wait(600);
 if(me.hand.length&&me.mana.length<9){const c=[...me.hand].sort((a,b)=>b.cost-a.cost)[0];me.hand=me.hand.filter(x=>x!==c);c.tapped=false;me.mana.push(c);log('相手がマナを置いた');render();await wait(500)}
 for(;;){const pl=me.hand.filter(c=>canPay(me,c)).sort((a,b)=>b.cost-a.cost)[0];if(!pl||G.over)break;pay(me,pl);me.hand=me.hand.filter(x=>x!==pl);await enter(1,pl,pl.fl.includes('e')?evo(me,pl).sort((a,b)=>a.pow-b.pow)[0]:null);render();await wait(650)}
 for(const c of [...me.bz]){if(G.over)return;if(c.tapped||c.sick||!me.bz.includes(c))continue;
  const t=op.bz.filter(x=>x.tapped&&x.pow<c.pow).sort((a,b)=>b.pow-a.pow)[0];
  if(t)await attack(1,c,t);
  else if(!op.shields.length||!op.bz.some(x=>!x.tapped&&x.fl.includes('b'))||Math.random()<.5)await attack(1,c,'p');
  render();await wait(600)}}
$('#app').onclick=async e=>{if(busy||G.over||G.t)return;const me=G.p[0],hz=$('.zone.hand');if(hz)G.hs=hz.scrollLeft;const b=e.target.closest('button');
 if(b){const c=sel&&(me.hand.find(x=>x.id==sel.id)||me.bz.find(x=>x.id==sel.id));
  if(b.id=='ch'){me.hand=me.hand.filter(x=>x!==c);c.tapped=false;me.mana.push(c);me.charged=true;sel=null}
  else if(b.id=='sm'){let s=null;if(c.fl.includes('e')){const ev=evo(me,c);s=ev[ev.length>1?await ask('進化元を選ぶ',ev.map(x=>`${x.name}(${x.pow})`)):0]}pay(me,c);me.hand=me.hand.filter(x=>x!==c);busy=true;await enter(0,c,s);busy=false;sel=null}

  render();return}
 const el=e.target.closest('.card');if(!el)return;const z=el.parentElement.dataset.z,id=+el.dataset.id;
 if(z=='h')sel={k:'h',id};
 else if(z=='m'){const c=me.bz.find(x=>x.id==id);if(c&&!c.tapped&&!c.sick)sel={k:'m',id};else log('そのクリーチャーは攻撃できません')}
 else if(z=='o'&&sel&&sel.k=='m'){const t=G.p[1].bz.find(x=>x.id==id);if(t&&t.tapped&&!t.fl.includes('z')){busy=true;await attack(0,me.bz.find(x=>x.id==sel.id),t);busy=false}else log('タップ中のクリーチャーだけ攻撃できます')}

function build(){return new Promise(res=>{let cnt=RAW.map(()=>0);try{const s=JSON.parse(localStorage.getItem('deck')||'null');if(s)cnt=RAW.map((_,i)=>s[i]||0)}catch(e){}cnt=cnt.map((x,i)=>Math.min(x,4,own[i]));
 const m=$('#modal'),box=m.firstElementChild;box.style.maxHeight='88vh';box.style.overflow='auto';
 const paint=()=>{const st=box.scrollTop,n=cnt.reduce((a,b)=>a+b,0);
  box.innerHTML=`<h2>デッキ構築(${n}/40枚)</h2><p>所持している分だけ入れられます（同じカード4枚まで。ガチャで増やせます）。前回のデッキは自動で保存されます。</p>`+RAW.map((c,i)=>`<div class="row ${c.civ}" style="justify-content:space-between;border-left:6px solid var(--c);padding-left:6px${own[i]?'':';opacity:.35'}"><span style='width:56px;flex:none;margin-right:6px'>${art(c)}</span><span style="font-size:12px;flex:1">${rar(c)} ${CN[c.civ]} ${c.cost} ${c.name}<br><small>${c.type=='c'?'パワー'+c.pow+' ':'呪文 '}${tags(c)} ${fxText(c)}</small></span><span class="row"><button data-i="${i}" data-d="-1">−</button><b>${cnt[i]}</b><small>/${own[i]}</small><button data-i="${i}" data-d="1">＋</button></span></div>`).join('')+`<button data-ok="1" style="position:sticky;bottom:0" ${n==40?'':'disabled'}>${n==40?'この40枚で対戦':'あと'+(40-n)+'枚'}</button>`;box.scrollTop=st};

  const i=+b.dataset.i,d=+b.dataset.d,n=cnt.reduce((a,b)=>a+b,0);if(d>0&&(cnt[i]>=Math.min(4,own[i])||n>=40))return;if(d<0&&cnt[i]<=0)return;cnt[i]+=d;paint()};

function collection(){return new Promise(res=>{const m=$('#modal'),box=m.firstElementChild;let f='';box.style.maxHeight='88vh';box.style.overflow='auto';

 box.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.x){box.style.maxHeight='';box.style.overflow='';m.style.display='none';res();return}f=b.dataset.f;paint()};

 if(k==PAIRS.length+2){await collection();return start()}if(k==PAIRS.length+1){await gacha();return start()}const cu=k==PAIRS.length?await build():null;const o=PAIRS.filter((_,i)=>i!=k);const ok=await ask('相手のデッキ',['ランダム',...names.slice(0,PAIRS.length)]);diff=await ask('CPUの強さ',['かんたん（シールド4枚・ミス多め）','ふつう','つよい（シールド6枚）']);G={p:[cu?mkP(null,cu):mkP(PAIRS[k]),mkP(ok==0?o[Math.random()*o.length|0]:PAIRS[ok-1])],t:0,first:true,over:false,hs:0};if(diff==0)G.p[1].deck.unshift(G.p[1].shields.pop());if(diff==2)G.p[1].shields.push(G.p[1].deck.pop());logs=[];busy=false;sel=null;startTurn(0)}

<style>
:root{--bg:#e6ebf2;--panel:#d3dbe8;--ink:#12202f;--mut:#51627a;--card:#fff;--line:#9fb0c6;--sel:#12202f;--r:#d4452f;--b:#2f7fc4;--g:#3f9a52;--y:#d9a81e;--p:#7a4aa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1826;--panel:#16263a;--ink:#e8eef6;--mut:#8fa3bd;--card:#223650;--line:#35506f;--sel:#fff}}
:root[data-theme="dark"]{--bg:#0d1826;--panel:#16263a;--ink:#e8eef6;--mut:#8fa3bd;--card:#223650;--line:#35506f;--sel:#fff}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif}
#app{max-width:560px;margin:auto;padding:36px 8px 8px;display:flex;flex-direction:column;gap:6px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);gap:8px}
.row{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.sh u{width:16px;height:22px;border:2px solid var(--mut);border-radius:3px;background:var(--panel);background-size:cover;background-position:center}
.dk{width:16px;height:22px;object-fit:cover;border-radius:3px;vertical-align:-6px;margin-right:4px;border:1px solid var(--mut)}
.mn u{width:13px;height:13px;border-radius:3px;display:inline-block}.mn u.t{opacity:.25}
.r{--c:var(--r)}.b{--c:var(--b)}.g{--c:var(--g)}.y{--c:var(--y)}.p{--c:var(--p)}.mn u{background:var(--c)}
.zone{min-height:152px;display:flex;gap:6px;flex-wrap:wrap;background:var(--panel);border-radius:8px;padding:6px;align-content:flex-start}
.zone.hand{flex-wrap:nowrap;overflow-x:auto}
.empty{font-size:11px;color:var(--mut);align-self:center;margin:auto}
.card{flex:none;width:84px;height:146px;box-sizing:border-box;background:var(--card);border:2px solid var(--line);border-top:9px solid var(--c);border-radius:6px;padding:3px 4px;font-size:11px;position:relative;cursor:pointer;line-height:1.25;overflow:hidden}
.card i{font-style:normal;font-weight:900;font-size:13px;margin-right:3px}.card b{font-weight:700}
.card s{text-decoration:none;position:absolute;right:4px;bottom:2px;font-weight:900;font-size:12px}
.card em{display:block;font-style:normal;font-size:9px;color:var(--mut);margin-top:2px}
.card.tap{opacity:.5;transform:rotate(7deg)}.card.sel{outline:3px solid var(--sel);outline-offset:1px}
#log{font-size:12px;min-height:44px;color:var(--mut)}
.act{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:36px}
button{font:inherit;font-weight:700;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
button:disabled{opacity:.4}button:focus-visible{outline:3px solid var(--b);outline-offset:2px}small{color:var(--mut);font-size:11px}
@keyframes pop{from{transform:scale(.6) translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-5px);background:var(--r)}75%{transform:translateX(5px)}}
.card.in{animation:pop .28s ease-out}.sh.hit{animation:hit .35s}
@media (prefers-reduced-motion:reduce){.card.in,.sh.hit{animation:none}}
#snd{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;padding:5px 9px;font-size:12px;z-index:5}
.card::after{content:attr(data-r);position:absolute;top:0;right:3px;font-size:9px;font-weight:900;color:var(--mut)}
.card.qR,.card.qSR{border-color:#b8860b}.card.qR::after,.card.qSR::after{color:#b8860b}
.card.qSR{box-shadow:0 0 8px #d9a81e}
.gg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.gc{--w:56px;--h:78px;--fs:9px;position:relative;perspective:600px;width:var(--w);height:var(--h);cursor:pointer}
.gg.big .gc{--w:130px;--h:176px;--fs:13px}
.gc>div{position:absolute;inset:0;backface-visibility:hidden;transition:transform .5s;border-radius:6px;box-sizing:border-box}
.gb{background:#1b2f4a var(--cbsel) center/cover;border:2px solid var(--line)}
.gi{transform:rotateY(180deg);background:var(--card);border:2px solid var(--line);border-top:8px solid var(--c);padding:3px;display:flex;flex-direction:column;font-size:var(--fs);line-height:1.25}
.gc.open .gb{transform:rotateY(-180deg)}.gc.open .gi{transform:none}
.gi b{position:absolute;top:1px;right:3px;font-size:calc(var(--fs) + 1px);color:var(--rc)}.gi strong{margin:auto 0}.gi small{align-self:flex-end;font-weight:900}
.gi em{position:absolute;bottom:2px;left:3px;font-style:normal;font-size:calc(var(--fs) - 1px);background:var(--r);color:#fff;padding:0 3px;border-radius:3px}
.gc.open .gi.qR{box-shadow:0 0 8px var(--rc)}.gc.open .gi.qSR{box-shadow:0 0 16px 3px var(--rc);animation:shimmer 1s infinite alternate}
.orbw{text-align:center;padding:30px 0}.orb{width:90px;height:90px;border-radius:50%;margin:auto;background:radial-gradient(circle at 30% 30%,#fff,#6b7f99);animation:shake .15s infinite alternate}
.orbw.pop .orb{animation:burst .5s forwards;background:radial-gradient(circle,#fff,var(--oc))}
@keyframes shake{from{transform:translateX(-4px) rotate(-5deg)}to{transform:translateX(4px) rotate(5deg)}}
@keyframes burst{from{transform:scale(1);opacity:1}to{transform:scale(3.4);opacity:0}}
@keyframes shimmer{from{filter:brightness(1)}to{filter:brightness(1.3)}}
@media (prefers-reduced-motion:reduce){.orb,.gi.qSR{animation:none!important}.gc>div{transition:none}}
.art{display:block;width:100%;height:40px;border-radius:3px;margin:2px 0}.gi .art{height:auto}
#modal{position:fixed;inset:0;background:rgba(5,10,20,.7);display:none;align-items:center;justify-content:center;padding:20px}
#modal div{background:var(--bg);border-radius:12px;padding:18px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:10px}
#modal h2{margin:0;font-size:16px;line-height:1.4}#modal p{margin:0;font-size:12px;color:var(--mut)}

function init(){own=LS.get('col',null);if(own&&own.length<RAW.length){own=[...own,...Array(RAW.length-own.length).fill(0)];LS.set('col',own)}if(!own||own.length!=RAW.length){own=RAW.map(()=>0);for(let n=0;n<20;n++)own[Math.random()*RAW.length|0]++;LS.set('col',own)}coins=LS.get('coins',1000);applyBack()}
function addCoins(n){coins+=n;LS.set('coins',coins)}
const rar=c=>c.cost>=6?'SR':c.cost>=4?'R':c.cost==3?'U':'C';
function roll(){const x=Math.random()*100,r=x<50?'C':x<78?'U':x<95?'R':'SR',pool=RAW.map((c,i)=>i).filter(i=>rar(RAW[i])==r);return pool[Math.random()*pool.length|0]}
function gacha(){return new Promise(res=>{const m=$('#modal'),box=m.firstElementChild,RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
 const RC={C:'#8fa3bd',U:'#3f9a52',R:'#2f7fc4',SR:'#d9a81e'},RK={C:0,U:1,R:2,SR:3};let out=[],opened=0,lock=false;box.style.maxWidth='420px';
 const btns=()=>`<button data-n="1" ${coins<100?'disabled':''}>1回 (100)</button><button data-n="10" ${coins<900?'disabled':''}>10連 (900)</button><button data-n="0">戻る</button>`;
 const menu=()=>{box.innerHTML=`<h2>カードガチャ</h2><p>所持コイン: ${coins}（勝利+150 / 敗北+50）<br>排出率 C50% U28% R17% SR5%。10連はR以上1枚確定。</p>`+btns()};
 const face=([i,nw],k)=>{const c=RAW[i],r=rar(c);return `<div class="gc" data-k="${k}"><div class="gi ${c.civ} q${r}" style="--rc:${RC[r]}"><b>${r}</b><span>${CN[c.civ]} ${c.cost}</span>${art(c)}<strong>${c.name}</strong><small>${c.type=='c'?c.pow:'呪文'}</small>${nw?'<em>NEW</em>':''}</div><div class="gb" style="box-shadow:0 0 ${r=='SR'?14:r=='R'?7:0}px ${RC[r]}"></div></div>`};
 const openOne=k=>{const el=box.querySelector(`.gc[data-k="${k}"]`);if(!el||el.classList.contains('open'))return;el.classList.add('open');opened++;const r=rar(RAW[out[k][0]]);
  if(r=='SR')[880,1100,1320].forEach((f,j)=>setTimeout(()=>sfx(f,.3,'triangle',.07),j*110));else sfx(r=='R'?760:r=='U'?520:400,.15,'triangle');
  if(opened==out.length){const t=box.querySelector('#gctl');if(t)t.innerHTML=btns()}};
 const orb=best=>new Promise(r=>{box.innerHTML=`<div class="orbw"><div class="orb" style="--oc:${RC[best]}"></div><p>…</p></div>`;sfx(180,.5,'sine',.06);
  setTimeout(()=>{sfx(best=='SR'?1100:best=='R'?800:600,.35,'triangle');box.firstElementChild.classList.add('pop');setTimeout(r,RM?100:500)},RM?400:1400)});
 const pull=async n=>{if(lock)return;lock=true;addCoins(-(n==1?100:900));out=[];opened=0;
  for(let k=0;k<n;k++){let i=roll();if(n==10&&k==9&&!out.some(([j])=>RK[rar(RAW[j])]>=2))while(RK[rar(RAW[i])]<2)i=roll();out.push([i,own[i]==0]);own[i]++}
  LS.set('col',own);const best=out.reduce((a,[i])=>RK[rar(RAW[i])]>RK[a]?rar(RAW[i]):a,'C');
  await orb(best);box.innerHTML=`<h2>${n==1?'結果':'10連結果'}</h2><div class="gg${n==1?' big':''}">${out.map(face).join('')}</div><div id="gctl" class="row" style="margin-top:10px">${n==1?'':'<button data-all="1">すべてめくる</button>'}</div>`;lock=false;
  if(n==1)setTimeout(()=>openOne(0),400)};
 box.onclick=e=>{const b=e.target.closest('button'),c=e.target.closest('.gc');
  if(c){openOne(+c.dataset.k);return}if(!b||b.disabled)return;
  if(b.dataset.all){out.forEach((_,k)=>setTimeout(()=>openOne(k),k*130));b.remove();return}
  const n=+b.dataset.n;if(!n){box.style.maxWidth='';m.style.display='none';res();return}pull(n)};
 m.style.display='flex';menu()})}
function gachaOld(){return new Promise(res=>{const m=$('#modal'),box=m.firstElementChild;let last=[];
 const paint=()=>{box.innerHTML=`<h2>カードガチャ</h2><p>所持コイン: ${coins}（勝利+150 / 敗北+50）<br>排出率 C50% U28% R17% SR5%。10連はR以上1枚確定。</p>`+(last.length?`<div style="max-height:40vh;overflow:auto;font-size:12px">${last.map(([i,nw])=>`<div class="row ${RAW[i].civ}" style="border-left:6px solid var(--c);padding-left:6px;margin:2px 0"><b style="${rar(RAW[i])=='SR'?'color:#b8860b':''}">${rar(RAW[i])}</b>&nbsp;${CN[RAW[i].civ]} ${RAW[i].name}${nw?' <b>NEW</b>':''}</div>`).join('')}</div>`:'')+`<button data-n="1" ${coins<100?'disabled':''}>1回 (100)</button><button data-n="10" ${coins<900?'disabled':''}>10連 (900)</button><button data-n="0">戻る</button>`};
 box.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const n=+b.dataset.n;if(!n){m.style.display='none';res();return}
  addCoins(-(n==1?100:900));last=[];for(let k=0;k<n;k++){let i=roll();if(n==10&&k==9&&!last.some(([j])=>rar(RAW[j])=='R'||rar(RAW[j])=='SR')){while(rar(RAW[i])=='C'||rar(RAW[i])=='U')i=roll()}last.push([i,own[i]==0]);own[i]++}
  LS.set('col',own);sfx(last.some(([j])=>rar(RAW[j])=='SR')?990:660,.25,'triangle');paint()};
 m.style.display='flex';paint()})}
function sfx(f,d=.12,t='square',v=.05){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}

 const p={deck:d,hand:[],shields:[],mana:[],bz:[],gy:[],charged:false};for(let i=0;i<5;i++){p.shields.push(p.deck.pop());p.hand.push(p.deck.pop())}return p}

function fxText0(c){const f=c.fx;if(!f)return'';const t=[];if(f.draw)t.push(f.draw+'枚引く');if(f.kill)t.push('パワー'+f.kill+'以下を破壊');if(f.bounce)t.push('相手の最強を手札へ');if(f.ramp)t.push('マナ+'+f.ramp);if(f.tap)t.push('相手を全タップ');if(f.disc)t.push('相手の手札を'+f.disc+'枚ランダムに捨てる');if(f.mburn)t.push('相手のマナを'+f.mburn+'枚墓地へ');if(f.wipe)t.push('パワー'+f.wipe+'以下のクリーチャーを全員破壊');if(f.rev)t.push('墓地のクリーチャー1体を手札へ');if(f.sbreak)t.push('相手のシールドを'+f.sbreak+'枚ブレイク');if(f.buff)t.push('自分の全クリーチャーのパワー+'+f.buff+'(次の自分のターンまで)');if(f.untap)t.push('自分のクリーチャーを全てアンタップ');if(f.rec)t.push('自分のクリーチャー1体を手札に戻す');if(f.grow)t.push('パワー+'+f.grow+'(永続)');if(f.refresh)t.push('自分のマナを全てアンタップ');if(f.wheel)t.push('お互いの手札を全て捨て、同じ枚数引く');if(f.sswap)t.push('手札1枚とシールド1枚を入れ替える');if(f.xt)t.push('このターンの後、もう1ターン行う');if(f.nb)t.push('このターン、相手のブロッカーはブロックできない');if(f.lock)t.push('相手のクリーチャー1体をタップし、次のターン起きない');if(f.loot)t.push(f.loot+'枚引い1枚捨てる');if(f.dig)t.push('山札の上'+f.dig+'枚から1枚を手札へ(残りは墓地)');if(f.sac)t.push('自分のクリーチャーを1体破壊');if(f.reani)t.push('コスト'+f.reani+'以下のクリーチャーを墓地から出す');if(f.mret)t.push('マナを'+f.mret+'枚手札に戻す');if(f.cheat)t.push('コスト'+f.cheat+'以下のクリーチャーを手札から出す');if(f.freeze)t.push('相手のクリーチャー1体をタップ');if(f.killt)t.push('タップ中の相手のパワー'+f.killt+'以下を破壊');if(f.steal)t.push('相手の手札を'+f.steal+'枚ランダムに奪う');if(f.mill)t.push('相手の山札を'+f.mill+'枚墓地へ');if(f.weak)t.push('相手の全クリーチャーのパワー-'+f.weak+'(次の相手のターンまで)');if(f.shield)t.push('シールド+1');return(c.type=='c'?'出た時:':'')+t.join('、')}

$('#app').onclick=async e=>{if(busy||G.over||G.t)return;const me=G.p[0],hz=$('.zone.hand');if(hz)G.hs=hz.scrollLeft;const b=e.target.closest('button');
 if(b){const c=sel&&(me.hand.find(x=>x.id==sel.id)||me.bz.find(x=>x.id==sel.id));
  if(b.id=='ch'){me.hand=me.hand.filter(x=>x!==c);c.tapped=false;me.mana.push(c);me.charged=true;sel=null}
  else if(b.id=='sm'){let s=null;if(c.fl.includes('e')){const ev=evo(me,c);s=ev[ev.length>1?await ask('進化元を選ぶ',ev.map(x=>`${x.name}(${x.pow})`)):0]}pay(me,c);me.hand=me.hand.filter(x=>x!==c);busy=true;await enter(0,c,s);busy=false;sel=null}
  else if(b.id=='ap'){busy=true;await attack(0,c,'p');busy=false}
  else if(b.id=='end'){busy=true;await eot(0);busy=false;const nx=G.xt==1?0:1;G.xt=0;startTurn(nx);return}
  render();return}
 const el=e.target.closest('.card');if(!el)return;const z=el.parentElement.dataset.z,id=+el.dataset.id;
 if(z=='h')sel={k:'h',id};
 else if(z=='m'){const c=me.bz.find(x=>x.id==id);if(c&&!c.tapped&&!c.sick)sel={k:'m',id};else log('そのクリーチャーは攻撃できません')}
 else if(z=='o'&&sel&&sel.k=='m'){const t=G.p[1].bz.find(x=>x.id==id);if(t&&t.tapped&&!t.fl.includes('z')){busy=true;await attack(0,me.bz.find(x=>x.id==sel.id),t);busy=false}else log('タップ中のクリーチャーだけ攻撃できます')}
 render()};
function build(){return new Promise(res=>{let cnt=RAW.map(()=>0);try{const s=JSON.parse(localStorage.getItem('deck')||'null');if(s)cnt=RAW.map((_,i)=>s[i]||0)}catch(e){}cnt=cnt.map((x,i)=>Math.min(x,4,own[i]));
 const m=$('#modal'),box=m.firstElementChild;box.style.maxHeight='88vh';box.style.overflow='auto';let q='',fc='',fco='';
 const total=()=>cnt.reduce((a,b)=>a+b,0);
 const match=c=>(!fc||c.civ==fc)&&(!fco||(fco=='8+'?c.cost>=8:c.cost==+fco))&&(!q||c.name.includes(q));
 const row=(c,i)=>`<div class="row ${c.civ}" style="justify-content:space-between;border-left:6px solid var(--c);padding-left:6px${own[i]?'':';opacity:.35'}"><span style='width:56px;flex:none;margin-right:6px'>${art(c)}</span><span style="font-size:12px;flex:1">${rar(c)} ${CN[c.civ]} ${c.cost} ${c.name}<br><small>${c.type=='c'?'パワー'+c.pow+' ':'呪文 '}${tags(c)} ${fxText(c)}</small></span><span class="row"><button data-i="${i}" data-d="-1">−</button><b>${cnt[i]}</b><small>/${own[i]}</small><button data-i="${i}" data-d="1">＋</button></span></div>`;
 const paintList=()=>{const st=box.scrollTop;box.querySelector('#blist').innerHTML=RAW.map((c,i)=>[c,i]).filter(([c])=>match(c)).map(([c,i])=>row(c,i)).join('')||'<p style="font-size:12px;color:var(--mut)">条件に合うカードがありません</p>';box.querySelector('#dcnt').textContent=total();const ok=box.querySelector('#bok');ok.disabled=total()!=40;ok.textContent=total()==40?'この40枚で決定':'あと'+(40-total())+'枚';box.scrollTop=st};
 const close=v=>{box.style.maxHeight='';box.style.overflow='';m.style.display='none';res(v)};
 box.innerHTML=`<h2>デッキ構築(<span id="dcnt">${total()}</span>/40枚)</h2><p>所持している分だけ入れられます（同じカード4枚まで。ガチャで増やせます）。決めたデッキは自動で保存されます。</p><div class="row"><input id="bq" type="search" placeholder="カード名で検索" style="flex:1;min-width:140px;padding:8px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px"></div><div class="row">`+['',...Object.keys(CN)].map(k=>`<button data-fc="${k}" style="padding:5px 9px;font-size:12px">${k?CN[k]:'全文明'}</button>`).join('')+`<select id="bco" style="padding:6px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:12px"><option value="">全コスト</option>${[1,2,3,4,5,6,7].map(n=>`<option value="${n}">コスト${n}</option>`).join('')}<option value="8+">コスト8以上</option></select></div><div class="row"><button id="bauto" style="padding:6px 10px;font-size:12px">自動で40枚にする</button><button id="bclear" style="padding:6px 10px;font-size:12px">全部はずす</button><small>自動編成は、所持の多い2文明からコストの低い順に入れます</small></div><div id="blist"></div><div class="row" style="position:sticky;bottom:0"><button id="bok"></button><button id="bcancel">キャンセル</button></div>`;
 const fcBtns=[...box.querySelectorAll('[data-fc]')];const markFc=()=>fcBtns.forEach(b=>b.style.opacity=b.dataset.fc==fc?'1':'.45');markFc();
 box.querySelector('#bq').oninput=e=>{q=e.target.value.trim();paintList()};
 box.querySelector('#bco').onchange=e=>{fco=e.target.value;paintList()};
 box.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.id=='bok'){try{localStorage.setItem('deck',JSON.stringify(cnt))}catch(x){}close(cnt);return}
  if(b.id=='bcancel'){close(null);return}
  if(b.id=='bclear'){cnt=RAW.map(()=>0);paintList();return}
  if(b.id=='bauto'){cnt=RAW.map(()=>0);const sc={};Object.keys(CN).forEach(k=>sc[k]=0);RAW.forEach((c,i)=>sc[c.civ]+=own[i]);const pair=Object.keys(CN).sort((a,z)=>sc[z]-sc[a]).slice(0,2);const byCost=(x,y)=>x[0].cost-y[0].cost||y[0].pow-x[0].pow;const fill=pool=>{for(const [c,i] of pool)while(cnt[i]<Math.min(4,own[i])&&total()<40)cnt[i]++};fill(RAW.map((c,i)=>[c,i]).filter(([c,i])=>pair.includes(c.civ)&&own[i]>0).sort(byCost));if(total()<40)fill(RAW.map((c,i)=>[c,i]).filter(([c,i])=>!pair.includes(c.civ)&&own[i]>0).sort(byCost));paintList();return}
  if(b.hasAttribute('data-fc')){fc=b.dataset.fc;markFc();paintList();return}
  const i=+b.dataset.i,d=+b.dataset.d,n=total();if(d>0&&(cnt[i]>=Math.min(4,own[i])||n>=40))return;if(d<0&&cnt[i]<=0)return;cnt[i]+=d;paintList()};
 m.style.display='flex';paintList()})}
function collection(){return new Promise(res=>{const m=$('#modal'),box=m.firstElementChild;let f='';box.style.maxHeight='88vh';box.style.overflow='auto';
 const paint=()=>{const st=box.scrollTop,got=own.filter(x=>x>0).length;
  box.innerHTML=`<h2>カード図鑑（${got}/${RAW.length}種）</h2><div class="row">`+['',...Object.keys(CN)].map(k=>`<button data-f="${k}" style="padding:5px 9px;font-size:12px${f==k?'':';opacity:.45'}">${k?CN[k]:'全て'}</button>`).join('')+'</div>'+RAW.map((c,i)=>[c,i]).filter(([c])=>!f||c.civ==f).sort((a,b)=>b[0].cost-a[0].cost).map(([c,i])=>`<div class="row ${c.civ}" style="border-left:6px solid var(--c);padding-left:6px${own[i]?'':';opacity:.35'}"><span style='width:56px;flex:none;margin-right:6px${own[i]?'':';filter:grayscale(1) brightness(.5)'}'>${art(c)}</span><span style="font-size:12px"><b style="${rar(c)=='SR'?'color:#b8860b':''}">${rar(c)}</b> ${CN[c.civ]} ${c.cost} ${own[i]?c.name+' ×'+own[i]:'？？？'}<br><small>${own[i]?(c.type=='c'?'パワー'+c.pow+' ':'呪文 ')+tags(c)+' '+fxText(c):'未入手'}</small></span></div>`).join('')+'<button data-x="1" style="position:sticky;bottom:0">戻る</button>';box.scrollTop=st};
 box.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.x){box.style.maxHeight='';box.style.overflow='';m.style.display='none';res();return}f=b.dataset.f;paint()};
 m.style.display='flex';paint()})}
function sleeveMenu(){return new Promise(res=>{const m=$('#modal'),box=m.firstElementChild;box.style.maxHeight='88vh';box.style.overflow='auto';
 const paint=()=>{const st=box.scrollTop;
  box.innerHTML=`<h2>スリーブ（所持コイン ${coins}）</h2><p>自分の山札・シールド・ガチャのカード裏面が、選んだスリーブの絵になります。相手のカードは標準の裏面です。</p>`+SLV.map(([id,nm,pr])=>{const ownS=slvOwn.includes(id),selS=slvSel==id;return `<div class="row" style="align-items:center"><img src="${BACK[id]}" style="width:54px;height:76px;object-fit:cover;border-radius:5px;border:2px solid ${selS?'#f0c040':'var(--line)'};margin-right:8px"><span style="flex:1;font-size:13px"><b>${nm}</b><br><small>${selS?'使用中':ownS?'所持しています':'価格 '+pr+' コイン'}</small></span>${selS?'<button disabled style="opacity:.5;padding:6px 10px">使用中</button>':ownS?`<button data-use="${id}" style="padding:6px 10px">使う</button>`:`<button data-buy="${id}" style="padding:6px 10px">${pr}で買う</button>`}</div>`}).join('')+'<button data-x="1" style="position:sticky;bottom:0">戻る</button>';box.scrollTop=st};
 box.onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.x){box.style.maxHeight='';box.style.overflow='';m.style.display='none';res();return}
  if(b.dataset.use){slvSel=b.dataset.use;LS.set('slvSel',slvSel);applyBack();paint();return}
  if(b.dataset.buy){const id=b.dataset.buy,sv=SLV.find(x=>x[0]==id),nm=sv[1],pr=sv[2];
   if(coins<pr){await ask('コインが足りません',['OK'],'「'+nm+'」は '+pr+' コインです。今は '+coins+' コインです。対戦に勝つと150コインもらえます。');m.style.display='flex';paint();return}
   if(await ask('スリーブを買いますか？',['買う','やめる'],'「'+nm+'」を '+pr+' コインで買います。（今 '+coins+' コイン）')!=0){m.style.display='flex';paint();return}
   coins-=pr;slvOwn.push(id);slvSel=id;LS.set('coins',coins);LS.set('slv',slvOwn);LS.set('slvSel',slvSel);applyBack();m.style.display='flex';paint()}};
 m.style.display='flex';paint()})}
function saveMenu(){return new Promise(res=>{const m=$('#modal'),box=m.firstElementChild;box.style.maxHeight='';box.style.overflow='';
 const paint=()=>{box.innerHTML=`<h2>セーブの管理</h2><p>所持カード・コイン・保存デッキをファイルに書き出せます。別の端末では、そのファイルを読み込むと続きから遊べます。</p><button id="exp">ファイルに書き出す</button><button id="imp">ファイルから読み込む</button><button id="bak">戻る</button><input type="file" id="imf" accept=".json,application/json" style="display:none">`;
  box.querySelector('#imf').onchange=e=>{const file=e.target.files[0];if(!file)return;file.text().then(async tx=>{let d=null;try{d=JSON.parse(tx)}catch(x){}
   if(!d||!Array.isArray(d.col)||typeof d.coins!='number'){await ask('読み込めませんでした',['OK'],'ファイルが壊れているか、デュエル・アリーナのセーブではありません。');paint();m.style.display='flex';return}
   if(await ask('読み込みますか？',['読み込む','やめる'],'今の所持カード・コイン・デッキは、ファイルの内容で上書きされます。')!=0){paint();m.style.display='flex';return}
   own=RAW.map((_,i)=>Math.max(0,d.col[i]|0));coins=d.coins;LS.set('col',own);LS.set('coins',coins);if(Array.isArray(d.slv)){slvOwn=d.slv.filter(x=>SLV.some(x2=>x2[0]==x));if(!slvOwn.includes('std'))slvOwn.unshift('std');LS.set('slv',slvOwn)}if(SLV.some(x=>x[0]==d.slvSel)&&slvOwn.includes(d.slvSel)){slvSel=d.slvSel;LS.set('slvSel',slvSel)}applyBack();if(Array.isArray(d.deck))localStorage.setItem('deck',JSON.stringify(d.deck));else localStorage.removeItem('deck');await ask('読み込みました',['OK'],'所持カード '+own.filter(x=>x>0).length+'種／コイン '+coins);paint();m.style.display='flex'})};
  box.onclick=e=>{const b=e.target.closest('button');if(!b)return;
   if(b.id=='bak'){m.style.display='none';res();return}
   if(b.id=='exp'){const data={app:'duel-arena',ver:VER,col:own,coins:coins,slv:slvOwn,slvSel:slvSel,deck:(()=>{try{return JSON.parse(localStorage.getItem('deck')||'null')}catch(x){return null}})()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='duel-arena_save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return}
   if(b.id=='imp')box.querySelector('#imf').click()}};
 paint();m.style.display='flex'})}
async function home(){init();const got=own.filter(x=>x>0).length;const k=await ask('デュエル・アリーナ',['対戦する','デッキを組む','カードガチャ','カード図鑑','スリーブ','セーブの書き出し・読み込み'],`Ver ${VER}　所持コイン ${coins}　集めたカード ${got}/${RAW.length}種`);
 if(k==0)return battle();if(k==1){await build();return home()}if(k==2){await gacha();return home()}if(k==3){await collection();return home()}if(k==4){await sleeveMenu();return home()}await saveMenu();return home()}
async function battle(){init();const names=[...PAIRS.map(p=>p.map(c=>CN[c]).join('×')),'自分でデッキを組む'];let saved=null;try{saved=JSON.parse(localStorage.getItem('deck')||'null')}catch(e){}const hasSaved=!!(saved&&saved.reduce((a,b)=>a+(b||0),0)==40);if(hasSaved)names.push('保存した自作デッキ');
 const k=await ask('デッキを選ぶ',names,'所持コイン '+coins+'。プリセットは全カード使えます。自作デッキは所持カードのみ。相手はランダムです。');
 let cu=null;if(k==PAIRS.length){cu=await build();if(!cu)return home()}else if(hasSaved&&k==PAIRS.length+1)cu=saved;
 const o=PAIRS.filter((_,i)=>i!=k);const ok=await ask('相手のデッキ',['ランダム',...PAIRS.map(p=>p.map(c=>CN[c]).join('×'))]);diff=await ask('CPUの強さ',['かんたん（シールド4枚・ミス多め）','ふつう','つよい（シールド6枚）']);G={p:[cu?mkP(null,cu):mkP(PAIRS[k]),mkP(ok==0?o[Math.random()*o.length|0]:PAIRS[ok-1])],t:0,first:true,over:false,hs:0};if(diff==0)G.p[1].deck.unshift(G.p[1].shields.pop());if(diff==2)G.p[1].shields.push(G.p[1].deck.pop());logs=[];busy=false;sel=null;startTurn(0)}
function start(){return home()}
start();
</script></body></html>

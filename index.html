<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ebf2;--panel:#d3dbe8;--ink:#12202f;--mut:#51627a;--card:#fff;--line:#9fb0c6;--sel:#12202f;--r:#d4452f;--b:#2f7fc4;--g:#3f9a52;--y:#d9a81e;--p:#7a4aa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1826;--panel:#16263a;--ink:#e8eef6;--mut:#8fa3bd;--card:#223650;--line:#35506f;--sel:#fff}}
:root[data-theme="dark"]{--bg:#0d1826;--panel:#16263a;--ink:#e8eef6;--mut:#8fa3bd;--card:#223650;--line:#35506f;--sel:#fff}
html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif}
#app{max-width:560px;margin:auto;padding:36px 8px 8px;display:flex;flex-direction:column;gap:6px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);gap:8px}
.row{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.sh u{width:16px;height:22px;border:2px solid var(--mut);border-radius:3px;background:var(--panel);background-size:cover;background-position:center}
.dk{width:16px;height:22px;object-fit:cover;border-radius:3px;vertical-align:-6px;margin-right:4px;border:1px solid var(--mut)}
.mn u{width:13px;height:13px;border-radius:3px;display:inline-block}.mn u.t{opacity:.25}
.r{--c:var(--r)}.b{--c:var(--b)}.g{--c:var(--g)}.y{--c:var(--y)}.p{--c:var(--p)}.mn u{background:var(--c)}
.zone{min-height:152px;display:flex;gap:6px;flex-wrap:wrap;background:var(--panel);border-radius:8px;padding:6px;align-content:flex-start}
.zone.hand{flex-wrap:nowrap;overflow-x:auto}
.empty{font-size:11px;color:var(--mut);align-self:center;margin:auto}
.card{flex:none;width:84px;height:146px;box-sizing:border-box;background:var(--card);border:2px solid var(--line);border-top:9px solid var(--c);border-radius:6px;padding:3px 4px;font-size:11px;position:relative;cursor:pointer;line-height:1.25;overflow:hidden}
.card i{font-style:normal;font-weight:900;font-size:13px;margin-right:3px}.card b{font-weight:700}
.card s{text-decoration:none;position:absolute;right:4px;bottom:2px;font-weight:900;font-size:12px}
.card em{display:block;font-style:normal;font-size:9px;color:var(--mut);margin-top:2px}
.card.tap{opacity:.5;transform:rotate(7deg)}.card.sel{outline:3px solid var(--sel);outline-offset:1px}
#log{font-size:12px;min-height:44px;color:var(--mut)}
.act{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:36px}
button{font:inherit;font-weight:700;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
button:disabled{opacity:.4}button:focus-visible{outline:3px solid var(--b);outline-offset:2px}small{color:var(--mut);font-size:11px}
@keyframes pop{from{transform:scale(.6) translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-5px);background:var(--r)}75%{transform:translateX(5px)}}
.card.in{animation:pop .28s ease-out}.sh.hit{animation:hit .35s}
@media (prefers-reduced-motion:reduce){.card.in,.sh.hit{animation:none}}
#snd{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;padding:5px 9px;font-size:12px;z-index:5}
.card::after{content:attr(data-r);position:absolute;top:0;right:3px;font-size:9px;font-weight:900;color:var(--mut)}
.card.qR,.card.qSR{border-color:#b8860b}.card.qR::after,.card.qSR::after{color:#b8860b}
.card.qSR{box-shadow:0 0 8px #d9a81e}
.gg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.gc{--w:56px;--h:78px;--fs:9px;position:relative;perspective:600px;width:var(--w);height:var(--h);cursor:pointer}
.gg.big .gc{--w:130px;--h:176px;--fs:13px}
.gc>div{position:absolute;inset:0;backface-visibility:hidden;transition:transform .5s;border-radius:6px;box-sizing:border-box}
.gb{background:#1b2f4a var(--cbsel) center/cover;border:2px solid var(--line)}
.gi{transform:rotateY(180deg);background:var(--card);border:2px solid var(--line);border-top:8px solid var(--c);padding:3px;display:flex;flex-direction:column;font-size:var(--fs);line-height:1.25}
.gc.open .gb{transform:rotateY(-180deg)}.gc.open .gi{transform:none}
.gi b{position:absolute;top:1px;right:3px;font-size:calc(var(--fs) + 1px);color:var(--rc)}.gi strong{margin:auto 0}.gi small{align-self:flex-end;font-weight:900}
.gi em{position:absolute;bottom:2px;left:3px;font-style:normal;font-size:calc(var(--fs) - 1px);background:var(--r);color:#fff;padding:0 3px;border-radius:3px}
.gc.open .gi.qR{box-shadow:0 0 8px var(--rc)}.gc.open .gi.qSR{box-shadow:0 0 16px 3px var(--rc);animation:shimmer 1s infinite alternate}
.orbw{text-align:center;padding:30px 0}.orb{width:90px;height:90px;border-radius:50%;margin:auto;background:radial-gradient(circle at 30% 30%,#fff,#6b7f99);animation:shake .15s infinite alternate}
.orbw.pop .orb{animation:burst .5s forwards;background:radial-gradient(circle,#fff,var(--oc))}
@keyframes shake{from{transform:translateX(-4px) rotate(-5deg)}to{transform:translateX(4px) rotate(5deg)}}
@keyframes burst{from{transform:scale(1);opacity:1}to{transform:scale(3.4);opacity:0}}
@keyframes shimmer{from{filter:brightness(1)}to{filter:brightness(1.3)}}
@media (prefers-reduced-motion:reduce){.orb,.gi.qSR{animation:none!important}.gc>div{transition:none}}
.art{display:block;width:100%;height:40px;border-radius:3px;margin:2px 0}.gi .art{height:auto}
#modal{position:fixed;inset:0;background:rgba(5,10,20,.7);display:none;align-items:center;justify-content:center;padding:20px}
#modal div{background:var(--bg);border-radius:12px;padding:18px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:10px}
#modal h2{margin:0;font-size:16px;line-height:1.4}#modal p{margin:0;font-size:12px;color:var(--mut)}
#start{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#1d3a5f 0%,#0d1826 65%);cursor:pointer;padding:20px}
#start .in{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:340px}
#start img{width:168px;height:168px;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.55),0 0 0 3px #c9a227;animation:pop .4s ease-out}
#start h1{margin:0;font-size:34px;font-weight:900;letter-spacing:.06em;background:linear-gradient(180deg,#ffe98a,#d9a81e 60%,#a87b12);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
#start .tag{margin:0;color:#bcd2ea;font-size:13px;font-weight:700;letter-spacing:.12em}
#start button{font-size:17px;padding:13px 34px;border-radius:999px;background:linear-gradient(180deg,#f2c531,#c9930a);color:#231a02;box-shadow:0 4px 18px rgba(217,168,30,.45);animation:pulse 1.6s ease-in-out infinite}
#start small{color:#8fa3bd}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){#start img,#start button{animation:none}}
.gc .spark{position:absolute;inset:0;pointer-events:none;z-index:3}
.gc .spark i{position:absolute;font-style:normal;color:var(--rc,#d9a81e);text-shadow:0 0 6px var(--rc,#d9a81e);animation:sparkfly .8s ease-out forwards}
@keyframes sparkfly{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--sx),var(--sy)) scale(1.3);opacity:0}}
.gc.zoom{z-index:5}
.gc.zoom .gi{animation:zoompop .9s ease!important}

async function tournament(){if(G&&!G.over)return;const pd=await pickDeck();if(!pd)return home();const tk=await ask('勝ち抜き大会',['大会をはじめる','やめる'],'負けたら終わり。相手はだんだん強くなります（1戦目かんたん→2戦目ふつう→3戦目からつよい）。連勝ボーナスは1連勝ごとに100コインで、やめたときか負けたときにまとめてもらえます。');if(tk==1)return home();TM={streak:0,pair:pd.pair||null,cnt:pd.cnt||null};tourMatch()}
function start(){if(G&&!G.over)return;init();$('#app').innerHTML='';const td=new Date();const tds=td.getFullYear()+'-'+(td.getMonth()+1)+'-'+td.getDate();let bn='';if(LS.get('bonusDay','')!==tds){LS.set('bonusDay',tds);addCoins(200);bn='　デイリーボーナス+200コイン！'}const st=$('#start');$('#stImg').src=document.querySelector('link[rel="icon"]').href;const got=own.filter(x=>x>0).length;$('#stInfo').textContent=`Ver ${VER}　所持コイン ${coins}　集めたカード ${got}/${RAW.length}種`+bn;st.style.display='flex';st.onclick=()=>{st.style.display='none';bgmStart();home()}}
start();
</script></body></html>
